name: Test and deploy Spanish app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate learning logic
        run: node tests/core.test.cjs
      - name: Stage public app files
        run: |
          mkdir -p _site
          cp index.html styles.css app.js core.js data.js sw.js manifest.webmanifest .nojekyll _site/
          cp -R assets _site/assets
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Wait for Pages artifact visibility
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 30; attempt++) {
              const result = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId
              });
              if (result.data.artifacts.some(a => a.name === 'github-pages' && !a.expired)) return;
              await new Promise(resolve => setTimeout(resolve, 3000));
            }
            throw new Error('The Pages artifact is not yet available. Retry this deployment.');
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
